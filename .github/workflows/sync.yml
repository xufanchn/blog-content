name: Sync posts to all blog repos

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        repo:
          - blog-vitepress
          - blog-hugo
          - blog-hexo
    steps:
      - name: Checkout blog-content
        uses: actions/checkout@v4

      - name: Checkout target blog repo
        uses: actions/checkout@v4
        with:
          repository: xufanchn/${{ matrix.repo }}
          token: ${{ secrets.SYNC_TOKEN }}
          path: target

      - name: Copy posts and push
        run: |
          cd target

          case "${{ matrix.repo }}" in
            blog-vitepress)
              rm -rf posts/*
              mkdir -p posts
              cp ../posts/*.md posts/
              ;;
            blog-hugo)
              rm -rf content/posts/*
              mkdir -p content/posts
              cp ../posts/*.md content/posts/
              ;;
            blog-hexo)
              rm -rf source/_posts/*
              mkdir -p source/_posts
              cp ../posts/*.md source/_posts/
              ;;
          esac

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet; then
            echo "No changes, skipping."
            exit 0
          fi

          git add -A
          git commit -m "sync: update posts from blog-content"
          git push
